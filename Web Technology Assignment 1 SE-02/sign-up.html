<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manan | Sign Up</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">

    <!-- Navbar -->
    <nav class="bg-gray-900 text-white">
        <div class="max-w-6xl mx-auto px-6 py-4">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

                <a href="../index.html" class="text-2xl font-bold">
                    Manan
                </a>

                <div class="flex flex-wrap gap-4">
                    <a href="../index.html" class="hover:text-blue-400">Home</a>
                    <a href="about.html" class="hover:text-blue-400">About</a>
                    <a href="contact.html" class="hover:text-blue-400">Contact</a>
                    <a href="sign-in.html" class="hover:text-blue-400">Sign In</a>
                    <a href="sign-up.html" class="hover:text-blue-400">Sign Up</a>
                </div>

            </div>
        </div>
    </nav>


    <!-- Sign Up Section -->
    <main class="min-h-screen flex items-center justify-center px-6 py-16">

        <div class="w-full max-w-md">

            <!-- Header -->
            <div class="text-center mb-8">

                <span class="inline-block bg-blue-100 text-blue-600 px-4 py-2 rounded-full text-sm mb-4">
                    Join Manan
                </span>

                <h1 class="text-3xl font-bold mb-3">
                    Create Your Account
                </h1>

                <p class="text-gray-600">
                    Sign up to get started with Manan.
                </p>

            </div>


            <!-- Form Card -->
            <div class="bg-white rounded-xl shadow-lg p-8">

                <form>

                    <!-- Full Name -->
                    <div class="mb-5">

                        <label for="name" class="block font-medium mb-2">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >

                    </div>


                    <!-- Email -->
                    <div class="mb-5">

                        <label for="email" class="block font-medium mb-2">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >

                    </div>


                    <!-- Password -->
                    <div class="mb-5">

                        <label for="password" class="block font-medium mb-2">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >

                    </div>


                    <!-- Confirm Password -->
                    <div class="mb-5">

                        <label for="confirm-password" class="block font-medium mb-2">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm your password"
